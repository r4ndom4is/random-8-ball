<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Flat 8-ball, transparent bg, edge-to-edge (D2 style: white window, dark 8) -->
  <circle cx="32" cy="32" r="31" fill="#0f0f14"/>
  <!-- Faint rim so the black ball stays visible on dark browser tabs -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="1.5"/>
  <!-- White window -->
  <circle cx="32" cy="32" r="17.5" fill="#f4f0ff"/>
  <!-- The 8 -->
  <text x="32" y="41.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#1a1030">8</text>
</svg>
