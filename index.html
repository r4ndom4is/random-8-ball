<head>

<style>
  :root {
    /* Dark-theme defaults — valid in every browser (no light-dark() needed) */
    --accent: #a855f7;
    --bg1: #1a1030;
    --bg2: #2d1b4e;
    --text: #ffffff;
    --chip-bg: rgba(255, 255, 255, 0.08);
    --chip-border: rgba(255, 255, 255, 0.18);
    --error: #fca5a5;
  }
  /* Modern browsers: full automatic light/dark via light-dark() */
  @supports (color: light-dark(#000, #fff)) {
    :root {
      color-scheme: light dark;
      --accent: light-dark(#7c3aed, #a855f7);
      --bg1: light-dark(#d7cff0, #1a1030);
      --bg2: light-dark(#f5f2fb, #2d1b4e);
      --text: light-dark(#241640, #ffffff);
      --chip-bg: light-dark(rgba(45,27,78,0.06), rgba(255,255,255,0.08));
      --chip-border: light-dark(rgba(45,27,78,0.18), rgba(255,255,255,0.18));
      --error: light-dark(#c0261f, #fca5a5);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"]  { color-scheme: dark; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 50% 30%, var(--bg2), var(--bg1) 70%);
    overflow: hidden;
    transition: background 0.35s ease, color 0.35s ease;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
    user-select: none;
  }
  h1 {
    font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-shadow: 0 2px 12px rgba(168, 85, 247, 0.6);
  }
  .subtitle {
    opacity: 0.7;
    font-size: 0.95rem;
    margin-bottom: 0;
  }

  .ball-wrap {
    position: relative;
    perspective: 900px;
    margin-top: 28px;
    margin-bottom: 28px;
  }
  /* Stationary specular highlight — sits over the ball but does NOT shake,
     so the shine appears to glide across the surface as the ball moves */
  .gloss {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    background: radial-gradient(52% 44% at 31% 24%,
      rgba(255,255,255,0.42) 0%,
      rgba(255,255,255,0.20) 26%,
      rgba(255,255,255,0.06) 52%,
      rgba(255,255,255,0) 82%);
  }
  .ball {
    position: relative;
    width: min(82vw, 400px, 66vh);
    height: min(82vw, 400px, 66vh);
    border-radius: 50%;
    cursor: pointer;
    background:
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%),
      radial-gradient(circle at 32% 28%, #4a4a4a, #101010 55%, #000 100%);
    /* Only the purple halo (last shadow layer) changes on hover, via --halo */
    --halo: 0 0 67px rgba(168, 85, 247, 0.25);
    box-shadow:
      inset -20px -25px 67px rgba(0,0,0,0.85),
      inset 16px 18px 45px rgba(255,255,255,0.12),
      inset 0 0 50px rgba(0,0,0,0.38),
      inset -2px -3px 18px rgba(128,116,158,0.12),
      0 34px 67px rgba(0,0,0,0.6),
      var(--halo);
    transition: transform 0.15s ease, box-shadow 0.5s ease;
  }
  .ball:hover {
    --halo: 0 0 90px rgba(168, 85, 247, 0.5);
    transition: transform 0.15s ease, box-shadow 0.35s ease;
  }
  .ball:active { transform: scale(0.97); }

  /* Idle "attract" cue: the halo breathes on its own until first interaction */
  @keyframes breathe {
    0%, 100% {
      box-shadow:
        inset -20px -25px 67px rgba(0,0,0,0.85),
        inset 16px 18px 45px rgba(255,255,255,0.12),
        inset 0 0 50px rgba(0,0,0,0.38),
        inset -2px -3px 18px rgba(128,116,158,0.12),
        0 34px 67px rgba(0,0,0,0.6),
        0 0 54px rgba(168, 85, 247, 0.18);
    }
    50% {
      box-shadow:
        inset -20px -25px 67px rgba(0,0,0,0.85),
        inset 16px 18px 45px rgba(255,255,255,0.12),
        inset 0 0 50px rgba(0,0,0,0.38),
        inset -2px -3px 18px rgba(128,116,158,0.12),
        0 34px 67px rgba(0,0,0,0.6),
        0 0 101px rgba(168, 85, 247, 0.55);
    }
  }
  .ball.idle { animation: breathe 4.5s ease-in-out infinite; }

  /* The blue triangle window */
  .window {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60%;
    height: 60%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1e3a8a 0%, #0b1e57 55%, #050d2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: size;
    box-shadow:
      inset 0 0 0 1.7px rgba(147,197,253,0.22),
      inset 0 4px 11px rgba(0,0,0,0.9),
      inset 0 0 42px rgba(0,0,0,0.8),
      0 0 0 4.5px #0a0a0c,
      0 -1px 2px 4.5px rgba(255,255,255,0.14),
      0 5px 10px 4.5px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  .advice-text {
    position: relative;
    z-index: 3;
    /* Constrain to the circle's inscribed square so text never hits the round edge */
    width: 70%;
    height: 70%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    line-height: 1.32;
    color: #dbeafe;
    text-shadow: 0 0 8px rgba(96,165,250,0.9);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #adviceInner {
    font-size: 16px;
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .advice-text.show { opacity: 1; }

  /* Idle "attract" cue: a big, faint static 8 invites a tap (stays until first shake) */
  @keyframes idle-in {
    from { opacity: 0; }
    to   { opacity: 0.5; }
  }
  .advice-text.idle {
    opacity: 0.5;
    animation: idle-in 1.8s ease 0.2s backwards;
  }
  .advice-text.idle.leaving { opacity: 0; }
  .advice-text.idle #adviceInner {
    font-size: clamp(4.5rem, 22vw, 9rem); /* fallback where container units are unsupported */
    font-size: 62cqmin;
    font-weight: 700;
    line-height: 1;
    position: relative;
    top: -0.06em;
  }

  @media (prefers-reduced-motion: reduce) {
    .ball.idle { animation: none; }
    .advice-text.idle { animation: none; }
  }

  /* ASCII art shown on error (same color as normal advice text) */
  .advice-text.broken { opacity: 1; }
  .advice-text.broken #adviceInner {
    white-space: pre;
    font-family: "Consolas", "Courier New", monospace;
    line-height: 1.15;
  }

  /* Swirling mist shown while advice loads */
  .mist {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    filter: blur(7px);
    transition: opacity 1.2s ease 0.3s;
  }
  .mist.show { opacity: 1; transition: opacity 0.4s ease 0.25s; }
  .mist::before,
  .mist::after {
    content: "";
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    transform-origin: center;
  }
  .mist::before {
    background: radial-gradient(42% 42% at 34% 40%, rgba(191,219,254,0.55), rgba(191,219,254,0) 70%);
    animation: swirl-a 5.5s linear infinite;
  }
  .mist::after {
    background: radial-gradient(46% 46% at 66% 62%, rgba(96,165,250,0.5), rgba(96,165,250,0) 70%);
    animation: swirl-b 8s linear infinite;
  }
  @keyframes swirl-a {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }
  @keyframes swirl-b {
    0%   { transform: rotate(0deg) scale(1.1); }
    50%  { transform: rotate(-180deg) scale(0.9); }
    100% { transform: rotate(-360deg) scale(1.1); }
  }

  /* History carousel nav row, below the hint at the very bottom */
  .nav-row {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 10px;
    min-height: 1.5em;
  }
  .nav-row.show { display: flex; }
  .nav-count {
    font-size: 0.82rem;
    opacity: 0.5;
    min-width: 2.8em;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .nav-btn {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    cursor: pointer;
    opacity: 0.55;
    backdrop-filter: blur(6px);
    transition: opacity 0.25s ease, color 0.2s ease, transform 0.1s ease, background 0.2s ease;
  }
  .nav-btn svg { width: 16px; height: 16px; display: block; }
  .nav-btn:disabled { opacity: 0.2; cursor: default; pointer-events: none; }
  .nav-btn:not(:disabled):hover { opacity: 1; color: var(--accent); }
  .nav-btn:not(:disabled):active { transform: scale(0.9); }
  /* During a shake, hide the row's contents but keep its reserved height */
  .nav-row.busy .nav-btn,
  .nav-row.busy .nav-count { visibility: hidden; }

  /* Shake animation */
  @keyframes shake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    15%  { transform: translate(-16px, 7px) rotate(-6deg); }
    30%  { transform: translate(13px, -9px) rotate(5deg); }
    45%  { transform: translate(-11px, 11px) rotate(-4deg); }
    60%  { transform: translate(11px, -7px) rotate(4deg); }
    75%  { transform: translate(-7px, 4px) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .shaking { animation: shake 0.7s ease-in-out; }

  .hint {
    opacity: 0.6;
    font-size: 0.9rem;
    min-height: 1.2em;
    transition: opacity 0.3s ease;
  }
  .hint.fading { opacity: 0; }
  .error { color: var(--error); opacity: 0.8; }

  /* Theme switcher, top-right */
  .theme-switch {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .theme-switch button {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text);
    opacity: 0.5;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .theme-switch button:hover { opacity: 0.85; }
  .theme-switch button.active {
    opacity: 1;
    background: rgba(168, 85, 247, 0.28);
  }
  .theme-switch svg { width: 17px; height: 17px; }

  /* Prominent Share button, top-left — matches the theme pill's height */
  .share-wrap { position: fixed; top: 16px; left: 16px; z-index: 10; }
  .share-btn {
    height: 42px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 16px;
    border-radius: 999px;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--text);
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
    opacity: 0.9;
    backdrop-filter: blur(6px);
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .share-btn:hover {
    opacity: 1;
    background: rgba(168, 85, 247, 0.14);
  }
  .share-btn:active { transform: scale(0.96); }
  .share-btn svg { width: 17px; height: 17px; }

  /* Dropdown menu under the Share pill */
  .share-menu {
    margin-top: 8px;
    min-width: 160px;
    padding: 6px;
    border-radius: 12px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .share-menu[hidden] { display: none; }
  .share-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 11px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.9rem;
    text-align: left;
    cursor: pointer;
    opacity: 0.9;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .share-item:hover { opacity: 1; background: rgba(168, 85, 247, 0.16); }
  .share-item svg { width: 17px; height: 17px; flex: 0 0 auto; }
  .share-item:disabled { opacity: 0.4; cursor: default; }
  .share-item:disabled:hover { background: transparent; opacity: 0.4; }

  /* Collapse the pill to an icon only on very narrow screens */
  @media (max-width: 360px) {
    .share-label { display: none; }
    .share-btn { padding: 0; width: 42px; justify-content: center; }
  }

  /* Footer credit */
  /* About / API-credit info button, bottom-right */
  .info-wrap { position: fixed; bottom: 16px; right: 16px; z-index: 10; }
  .info-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--chip-border);
    background: var(--chip-bg);
    color: var(--text);
    opacity: 0.4;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    transition: opacity 0.2s ease;
  }
  .info-btn:hover { opacity: 0.85; }
  .info-btn svg { width: 16px; height: 16px; }
  .info-pop {
    position: absolute;
    bottom: 40px;
    right: 0;
    width: max-content;
    max-width: 80vw;
    white-space: nowrap;
    padding: 11px 13px;
    border-radius: 12px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    font-size: 0.8rem;
    line-height: 1.5;
    text-align: left;
    color: var(--text);
  }
  .info-pop[hidden] { display: none; }
  .info-pop a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; }
  .info-pop .ver { display: block; margin-top: 6px; opacity: 0.6; }

  /* Short viewports (e.g. phone landscape): tighten so nothing overlaps */
  @media (max-height: 520px) {
    body { padding: 12px; }
    .subtitle { display: none; }
    h1 { font-size: clamp(1.1rem, 4vw, 1.6rem); margin-bottom: 0; }
    .ball-wrap { margin-top: 14px; margin-bottom: 14px; }
    .nav-row { margin-top: 6px; }
  }

  /* Debug gear lives inside the theme pill, revealed via Ctrl+Shift+D */
  .ts-sep {
    width: 1px;
    height: 20px;
    background: var(--chip-border);
    margin: 0 3px;
    align-self: center;
    display: none;
  }
  .theme-switch.debug-on .ts-sep { display: block; }
  .theme-switch .dev-toggle {
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text);
    opacity: 0.5;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    align-items: center;
    justify-content: center;
    display: none;
    transition: opacity 0.2s ease, background 0.2s ease;
  }
  .theme-switch .dev-toggle svg { width: 19px; height: 19px; display: block; }
  .theme-switch.debug-on .dev-toggle { display: flex; }
  .dev-toggle:hover { opacity: 0.85; }
  .dev-toggle[aria-expanded="true"] { opacity: 1; background: rgba(168, 85, 247, 0.28); }
  .dev-panel {
    position: absolute;
    top: 46px;
    right: 0;
    min-width: 200px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    font-size: 0.82rem;
    text-align: left;
  }
  .dev-panel[hidden] { display: none; }
  .dev-title {
    font-weight: 700;
    margin-bottom: 8px;
    opacity: 0.85;
    letter-spacing: 0.3px;
  }
  .dev-title--spaced { margin-top: 12px; }
  .dev-panel label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    cursor: pointer;
    opacity: 0.9;
  }
  .dev-panel input { accent-color: var(--accent); cursor: pointer; }
</style>
</head>

  <div class="share-wrap">
    <button class="share-btn" id="shareBtn" title="Share or copy" aria-label="Share or copy" aria-haspopup="true" aria-expanded="false">

      <span class="share-label" id="shareLabel">Share</span>
    </button>
    <div class="share-menu" id="shareMenu" hidden role="menu">
      <button class="share-item" id="menuShare" role="menuitem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.97M15.4 6.5l-6.8 3.97"/></svg>
        Share link
      </button>
      <button class="share-item" id="menuCopy" role="menuitem" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M6 15 H5 a2 2 0 0 1 -2 -2 V5 a2 2 0 0 1 2 -2 h8 a2 2 0 0 1 2 2 v1"/></svg>
        Copy advice
      </button>
    </div>
  </div>

  <div class="theme-switch" role="group" aria-label="Theme and options">
    <button data-theme-choice="auto" title="Match system theme" aria-label="System theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button data-theme-choice="light" title="Light theme" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>
    </button>
    <button data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8z"/></svg>
    </button>
    <span class="ts-sep" aria-hidden="true"></span>
    <button class="dev-toggle" id="devToggle" title="Test / debug options" aria-label="Debug options" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V15z"/></svg></button>
    <div class="dev-panel" id="devPanel" hidden>
      <div class="dev-title">Test mode</div>
      <label><input type="radio" name="testmode" value="off" checked> Normal</label>
      <label><input type="radio" name="testmode" value="network"> Force network error</label>
      <label><input type="radio" name="testmode" value="http"> Force HTTP 500</label>
    </div>
  </div>

  <h1>RandoM 8-Ball of Advice</h1>
  <div class="subtitle">Wisdom you didn't ask for</div>

  <div class="ball-wrap">
    <div class="ball idle" id="ball" role="button" tabindex="0" title="Click to shake for advice" aria-label="Shake the magic 8 ball for advice">
      <div class="window">
        <div class="mist" id="mist"></div>
        <div class="advice-text idle" id="advice" aria-live="polite" aria-atomic="true"><span id="adviceInner">8</span></div>
      </div>
    </div>
    <div class="gloss"></div>
  </div>

  <div class="hint" id="hint" role="status" aria-live="polite">Click the ball 🎱</div>

  <div class="nav-row" id="navRow">
    <button class="nav-btn nav-prev" id="navPrev" title="Older advice" aria-label="Older advice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6 L8 12 l6 6"/></svg></button>
    <span class="nav-count" id="navCount"></span>
    <button class="nav-btn nav-next" id="navNext" title="Newer advice" aria-label="Newer advice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6 L16 12 l-6 6"/></svg></button>
  </div>

  <div class="info-wrap">
    <button class="info-btn" id="infoBtn" title="About" aria-label="About" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.7" r="0.9" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="info-pop" id="infoPop" hidden>
      Advice courtesy of the
      <a href="https://api.adviceslip.com/" target="_blank" rel="noopener">Advice Slip API</a>
    <span class="ver">v1.9.14</span>
    </div>
  </div>

<script>
  const ball = document.getElementById('ball');
  const adviceEl = document.getElementById('advice');
  const adviceInner = document.getElementById('adviceInner');
  const hint = document.getElementById('hint');
  const mist = document.getElementById('mist');
  const shareBtn = document.getElementById('shareBtn');
  const shareMenu = document.getElementById('shareMenu');
  const navPrev = document.getElementById('navPrev');
  const navNext = document.getElementById('navNext');
  const navRow = document.getElementById('navRow');
  const navCount = document.getElementById('navCount');
  const menuCopy = document.getElementById('menuCopy');
  let busy = false;
  let currentAdvice = '';
  let currentSlipId = null;
  let copyResetTimer = null;
  let hintBeforeCopy = null;
  let hintFeedbackActive = false;

  // --- Advice history (persists across reloads) ---
  const HISTORY_KEY = 'rm8_history';
  const HISTORY_MAX = 50;
  let adviceHistory = [];
  let histIdx = 0; // index of displayed item; === length means idle/live (no item shown)

  // Timing / resilience (ms) — tweak the app's "feel" and reliability here
  const REVEAL_DELAY = 650;      // min time the mist swirls before revealing
  const ATTEMPT_TIMEOUT = 13000; // per-try cutoff — high enough for the API's slow cold TLS handshake (~10s), esp. iOS
  const MAX_ATTEMPTS = 2;        // total tries (1 initial + 1 retry) before erroring
  const RETRY_BACKOFF = 300;     // pause between tries
  const COPY_RESET = 2000;       // revert the copy icon + message after feedback

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // The Advice Slip API double-encodes some entries (UTF-8 bytes stored as
  // Latin-1 codepoints, e.g. "JÃ¤germeister"). Repair by reinterpreting the
  // chars as bytes and decoding as UTF-8; leave anything else untouched.
  function fixEncoding(str) {
    if (!/[\u0080-\u00ff]/.test(str)) return str;         // nothing to fix
    for (const ch of str) if (ch.charCodeAt(0) > 0xff) return str; // real unicode
    try {
      const bytes = Uint8Array.from(str, (ch) => ch.charCodeAt(0));
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (_) {
      return str;                                         // wasn't UTF-8, leave as-is
    }
  }

  const ASCII_ERROR = '(x_x)';
  const COPIED_MSG = 'Copied to clipboard!';
  const COPY_FAIL_MSG = 'Copy failed. Select the text manually.';

  const LOADING_MESSAGES = [
    'Consulting the cosmos...',
    'Shaking loose some wisdom...',
    'Peering into the murky depths...',
    'Summoning the oracle...',
    'Stirring the mystic fog...',
    'Aligning the stars...',
    'Decoding the universe...',
    'Waking the spirits...',
    'Reading the swirling tea leaves...',
    'Channelling ancient knowledge...'
  ];
  const REVEAL_MESSAGES = [
    'Shake again for more 🎱',
    'Still curious? Give it another shake 🎱',
    'The ball has more to say... shake on 🎱',
    'One more for the road? 🎱',
    'Not convinced? Shake again 🎱',
    'The cosmos never sleeps, shake again 🎱',
    'Care for a second opinion? 🎱',
    'Tap the ball for another nugget 🎱',
    'More wisdom awaits... shake it 🎱',
    'Go on, shake it once more 🎱'
  ];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const TIMEOUT_MESSAGES = [
    'The cosmos is slow to answer. Try again.',
    'The oracle dozed off. Give it another shake.',
    'The spirits are taking their time. Try again.',
    'Wisdom got lost in the ether. Shake again.'
  ];
  const NETWORK_MESSAGES = [
    'The spirits are unreachable. Try again.',
    'The connection to the beyond was severed. Try again.',
    'No signal from the cosmos. Check your connection.',
    'The oracle is offline. Try again shortly.'
  ];

  // Fits advice to the window: starts large so short messages fill the space,
  // then shrinks until it fits (long messages end up smaller).
  function setAdvice(text, maxSize) {
    adviceInner.textContent = text;
    let size = maxSize || 20;
    adviceInner.style.fontSize = size + 'px';
    let guard = 0;
    while (
      (adviceInner.scrollHeight > adviceEl.clientHeight ||
       adviceInner.scrollWidth > adviceEl.clientWidth) &&
      size > 10 && guard < 120
    ) {
      size -= 1;
      adviceInner.style.fontSize = size + 'px';
      guard++;
    }
  }

  // Enables/disables the menu's "Copy advice" based on whether real advice is shown
  function syncCopyState(hasAdvice) {
    menuCopy.disabled = !hasAdvice;
  }

  // Puts a stored advice item into the window (no fetch, no mist). Used by both
  // fresh reveals and history navigation. Sets current* so share/copy target it.
  function displayItem(item) {
    ball.classList.remove('idle');
    adviceEl.classList.remove('idle', 'leaving', 'broken');
    hint.classList.remove('error');
    mist.classList.remove('show');
    currentAdvice = item.advice;
    currentSlipId = (item.id != null) ? item.id : null;
    setAdvice(item.advice);
    adviceEl.classList.add('show');
    syncCopyState(true);
    updateArrows();
  }

  // Shows/hides the nav row and updates the "pos / total" counter.
  function updateArrows() {
    const n = adviceHistory.length;
    // Show the whole row (numbers + chevrons) whenever there's any history.
    navRow.classList.toggle('show', n >= 1);
    // While shaking, hide the contents (like before) but keep the space.
    navRow.classList.toggle('busy', busy);
    // Both arrows always render; grey out the one that can't move.
    navPrev.disabled = busy || histIdx <= 0;
    navNext.disabled = busy || histIdx >= n - 1;
    // Counter always shows when there's history; idle clamps to the newest.
    if (!busy && n >= 1) {
      const idx = Math.min(histIdx, n - 1);
      navCount.textContent = (idx + 1) + ' / ' + n;
    }
  }

  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) {
          adviceHistory = arr.filter((x) => x && typeof x.advice === 'string')
                             .map((x) => ({ advice: x.advice, id: (x.id != null) ? x.id : null }));
        }
      }
    } catch (_) {}
    if (adviceHistory.length > HISTORY_MAX) adviceHistory = adviceHistory.slice(-HISTORY_MAX);
    histIdx = adviceHistory.length; // idle/live position (nothing shown yet)
  }
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(adviceHistory.slice(-HISTORY_MAX))); } catch (_) {}
  }

  function goOlder() {
    if (histIdx > 0) { histIdx--; hintFeedbackActive = false; displayItem(adviceHistory[histIdx]); hint.textContent = 'A nugget from before 🎱'; }
  }
  function goNewer() {
    if (histIdx < adviceHistory.length - 1) {
      histIdx++; hintFeedbackActive = false; displayItem(adviceHistory[histIdx]);
      hint.textContent = (histIdx === adviceHistory.length - 1) ? 'Back to the latest 🎱' : 'A nugget from before 🎱';
    }
  }

  // Reveals a freshly-fetched piece of advice: append to history, jump to it.
  function revealAdvice(advice, slipId) {
    const item = { advice, id: (slipId != null) ? slipId : null };
    adviceHistory.push(item);
    if (adviceHistory.length > HISTORY_MAX) adviceHistory = adviceHistory.slice(-HISTORY_MAX);
    histIdx = adviceHistory.length - 1;
    saveHistory();
    busy = false;
    displayItem(item);
    hint.textContent = pick(REVEAL_MESSAGES);
  }

  // Shows an ASCII "the oracle shrugs" in the window and an error message.
  // Errors are NOT added to history.
  function showError(msg) {
    mist.classList.remove('show');
    adviceEl.classList.add('broken');
    setAdvice(ASCII_ERROR, 42);
    adviceEl.classList.add('show');
    hint.textContent = msg;
    hint.classList.add('error');
    busy = false;
    syncCopyState(false);
    updateArrows();
  }

  // Stops the first-load "attract" cues (breathing glow + faint 8)
  function stopIdle() {
    ball.classList.remove('idle');
    adviceEl.classList.remove('idle');
  }

  async function shake() {
    if (busy) return;
    busy = true;
    hintFeedbackActive = false;
    ball.classList.remove('idle');
    hint.classList.remove('error');
    hint.textContent = pick(LOADING_MESSAGES);

    // gracefully fade the idle 8 out at full size before it's removed
    if (adviceEl.classList.contains('idle')) {
      adviceEl.classList.add('leaving');
      setTimeout(() => adviceEl.classList.remove('idle', 'leaving'), 420);
    }
    // fade out current text and start shaking
    adviceEl.classList.remove('show', 'broken');
    updateArrows();
    mist.classList.add('show');
    ball.classList.remove('shaking');
    void ball.offsetWidth; // reflow to restart animation
    ball.classList.add('shaking');

    const started = Date.now();
    try {
      const slip = await fetchSlip('https://api.adviceslip.com/advice');
      const slipId = (slip.id != null) ? slip.id : slip.slip_id;
      const wait = Math.max(0, REVEAL_DELAY - (Date.now() - started));
      setTimeout(() => revealAdvice(slip.advice, slipId), wait);
    } catch (err) {
      const timedOut = err && err.name === 'AbortError';
      const msg = timedOut ? pick(TIMEOUT_MESSAGES) : pick(NETWORK_MESSAGES);
      const wait = Math.max(0, REVEAL_DELAY - (Date.now() - started));
      setTimeout(() => showError(msg), wait);
    }
  }

  ball.addEventListener('click', shake);
  ball.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); shake(); }
  });
  // Desktop: hovering the ball stops the breathing glow (reveals the real hover
  // glow), but the faint 8 stays until the first shake
  ball.addEventListener('pointerenter', () => ball.classList.remove('idle'), { once: true });

  // History arrows — navigate without shaking; stop the click reaching the ball
  navPrev.addEventListener('click', (e) => { e.stopPropagation(); goOlder(); });
  navNext.addEventListener('click', (e) => { e.stopPropagation(); goNewer(); });
  [navPrev, navNext].forEach((b) => b.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.stopPropagation(); }
  }));

  // --- Debug / test modes (hidden; toggle with Ctrl+Shift+D) ---
  let testMode = 'off';
  const themeSwitch = document.querySelector('.theme-switch');
  const devToggle = document.getElementById('devToggle');
  const devPanel = document.getElementById('devPanel');
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
      e.preventDefault();
      const on = themeSwitch.classList.toggle('debug-on');
      if (!on) {
        devPanel.setAttribute('hidden', '');
        devToggle.setAttribute('aria-expanded', 'false');
      }
    }
  });
  devToggle.addEventListener('click', () => {
    const open = devPanel.hasAttribute('hidden');
    if (open) { devPanel.removeAttribute('hidden'); } else { devPanel.setAttribute('hidden', ''); }
    devToggle.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('input[name="testmode"]').forEach((r) => {
    r.addEventListener('change', () => { testMode = r.value; });
  });

  // A single network attempt for a given URL. Honors the debug test modes
  // and aborts via the passed signal (per-attempt timeout).
  function rawFetch(url, signal) {
    switch (testMode) {
      case 'network':
        return Promise.reject(new TypeError('Simulated network failure'));
      case 'http':
        return Promise.resolve(new Response('simulated error', { status: 500 }));
      default:
        return fetch(url, { signal });
    }
  }

  // Fetches a slip with retries + per-attempt timeout. Returns the slip object
  // ({ id, advice }) or throws the last error after all attempts fail.
  async function fetchSlip(url) {
    let lastErr;
    for (let i = 0; i < MAX_ATTEMPTS; i++) {
      // Retry silently — the mist keeps swirling, user never sees the retries
      if (i > 0) await sleep(RETRY_BACKOFF);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), ATTEMPT_TIMEOUT);
      try {
        const res = await rawFetch(url, controller.signal);
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || !data.slip || !data.slip.advice) throw new Error('empty slip');
        data.slip.advice = fixEncoding(data.slip.advice);
        return data.slip;
      } catch (err) {
        clearTimeout(timeoutId);
        lastErr = err;
      }
    }
    throw lastErr || new Error('request failed');
  }

  // Copies a string, using the modern API with a legacy fallback (file:// etc.)
  async function copyText(str) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(str);
        return true;
      }
    } catch (_) { /* fall through to legacy method */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (_) { return false; }
  }

  // Shows a transient feedback message in the hint line, then fades back to
  // whatever was there before.
  function showHintFeedback(msg) {
    clearTimeout(copyResetTimer);
    if (!hintFeedbackActive) hintBeforeCopy = hint.textContent;
    hintFeedbackActive = true;
    hint.textContent = msg;
    copyResetTimer = setTimeout(() => {
      if (hint.textContent !== msg) { hintFeedbackActive = false; return; }
      hint.classList.add('fading');
      setTimeout(() => {
        if (hint.textContent === msg && hintBeforeCopy !== null) hint.textContent = hintBeforeCopy;
        hint.classList.remove('fading');
        hintFeedbackActive = false;
      }, 300);
    }, COPY_RESET);
  }

  async function copyCurrentAdvice() {
    if (!currentAdvice) return;
    const ok = await copyText(currentAdvice);
    showHintFeedback(ok ? COPIED_MSG : COPY_FAIL_MSG);
  }

  // --- Sharing: link carries the slip id (authentic) AND the text (fallback,
  // so the recipient always sees the advice even if the API can't be reached).
  // No id + only ?advice= is reserved for future user-submitted advice. ---
  function buildShareData() {
    const base = location.origin + location.pathname;
    let url = base;
    if (currentAdvice) {
      const params = new URLSearchParams();
      if (currentSlipId !== null) params.set('id', currentSlipId);
      params.set('advice', currentAdvice);
      url = base + '?' + params.toString();
    }
    const text = currentAdvice
      ? 'The RandoM 8-Ball told me: "' + currentAdvice + '" 🎱'
      : 'Get life advice you didn\'t ask for from the RandoM 8-Ball 🎱';
    return { title: 'RandoM 8-Ball of Advice', text, url };
  }

  async function shareAdvice() {
    const data = buildShareData();
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (err) { if (err && err.name === 'AbortError') return; /* else fall back */ }
    }
    // Fallback (e.g. desktop with no share sheet): copy the advice + link.
    const ok = await copyText(data.text + ' ' + data.url);
    showHintFeedback(ok ? 'Link copied to clipboard!' : 'Copy failed. Try again.');
  }

  // --- Share pill acts as a small menu (Share link / Copy advice) ---
  function closeShareMenu() {
    shareMenu.setAttribute('hidden', '');
    shareBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleShareMenu() {
    const open = shareMenu.hasAttribute('hidden');
    if (open) { shareMenu.removeAttribute('hidden'); shareBtn.setAttribute('aria-expanded', 'true'); }
    else { closeShareMenu(); }
  }
  shareBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleShareMenu(); });
  document.getElementById('menuShare').addEventListener('click', () => { closeShareMenu(); shareAdvice(); });
  document.getElementById('menuCopy').addEventListener('click', () => { closeShareMenu(); copyCurrentAdvice(); });
  // Close the menu on outside click or Escape
  document.addEventListener('click', (e) => {
    if (!shareMenu.hasAttribute('hidden') && !e.target.closest('.share-wrap')) closeShareMenu();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeShareMenu(); });

  // --- About / API-credit info popover (bottom-right) ---
  const infoBtn = document.getElementById('infoBtn');
  const infoPop = document.getElementById('infoPop');
  function closeInfo() { infoPop.setAttribute('hidden', ''); infoBtn.setAttribute('aria-expanded', 'false'); }
  infoBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = infoPop.hasAttribute('hidden');
    if (open) { infoPop.removeAttribute('hidden'); infoBtn.setAttribute('aria-expanded', 'true'); }
    else { closeInfo(); }
  });
  document.addEventListener('click', (e) => {
    if (!infoPop.hasAttribute('hidden') && !e.target.closest('.info-wrap')) closeInfo();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeInfo(); });

  // --- Open a shared link ---
  // Reads ?id= and/or ?advice= from the URL. Returns null if neither present.
  function getShared() {
    const p = new URLSearchParams(location.search);
    const id = p.get('id');
    const advice = p.get('advice');
    const validId = (id && /^\d+$/.test(id)) ? id : null;
    if (!validId && !advice) return null;
    return { id: validId, advice: advice || null };
  }

  async function loadShared(shared) {
    busy = true;
    stopIdle();
    hint.classList.remove('error');
    hint.textContent = 'Unwrapping shared wisdom...';
    mist.classList.add('show');

    // If we have an id, try to fetch the authentic slip first.
    if (shared.id) {
      try {
        const slip = await fetchSlip('https://api.adviceslip.com/advice/' + shared.id);
        revealAdvice(slip.advice, shared.id);
        hint.textContent = 'Shared with you ✨ shake for your own 🎱';
        history.replaceState(null, '', location.pathname);
        return;
      } catch (err) {
        // fall through to the embedded text below
      }
    }

    // Fallback (or no id): show the text carried in the link itself.
    if (shared.advice) {
      revealAdvice(fixEncoding(shared.advice), shared.id);
      hint.textContent = 'Shared with you ✨ shake for your own 🎱';
      history.replaceState(null, '', location.pathname);
      return;
    }

    // Only reachable when we had an id, no embedded text, and the fetch failed.
    showError('Could not reach the shared wisdom. Refresh to try again.');
  }

  // --- Theme switching (auto / light / dark) ---
  const themeButtons = document.querySelectorAll('.theme-switch [data-theme-choice]');
  function applyTheme(choice) {
    if (choice === 'auto') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', choice);
    }
    try { localStorage.setItem('theme', choice); } catch (_) {}
    themeButtons.forEach((b) => {
      b.classList.toggle('active', b.dataset.themeChoice === choice);
    });
  }
  themeButtons.forEach((b) => {
    b.addEventListener('click', () => applyTheme(b.dataset.themeChoice));
  });
  let savedTheme = 'auto';
  try { savedTheme = localStorage.getItem('theme') || 'auto'; } catch (_) {}
  applyTheme(savedTheme);

  // Re-fit the current advice when the window size changes
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentAdvice) setAdvice(currentAdvice);
    }, 150);
  });

  // On load: restore history, then if opened from a share link show that advice
  loadHistory();
  updateArrows();
  const shared = getShared();
  if (shared) loadShared(shared);
</script>
</body>
